<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confession NHS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="picture">
        <img src="NHS.jpg" alt="Logo trường THPT Nguyễn Hùng Sơn">
    </div>

    <h1>Confession NHS</h1>

    <div id="send_confession">
        <h3>Gửi confession ở đây</h3>
    </div>

    <form id="confession_form" autocomplete="off">
        <input id="confession_input" placeholder="Nhập confession của bạn...">
        <button type="submit">Gửi</button>
    </form>

    <p id="form_error"></p>

    <div id="confession_list"></div>

    <script src="script.js"></script>
</body>
</html>
